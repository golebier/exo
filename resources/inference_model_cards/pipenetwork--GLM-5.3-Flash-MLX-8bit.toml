model_id = "pipenetwork/GLM-5.3-Flash-MLX-8bit"
n_layers = 45
hidden_size = 4096
num_key_value_heads = 64
supports_tensor = false
# NOTE: GLM-5.3-Flash is a hybrid-attention VLM (sparse MLA + gated-delta
# linear attn + pooled indexer). Its layer projections don't match any
# existing TP sharding strategy, so it runs via pipeline parallelism
# (model-agnostic layer slicing) until a dedicated Glm5NextShardingStrategy
# is added. The text-only glm_moe_dsa variants keep supports_tensor=true.
tasks = ["TextGeneration"]
family = "glm"
quantization = "8bit"
base_model = "GLM-5.3-Flash"
capabilities = ["text", "vision", "thinking"]
reasoning_dialect = "post_last_user"
context_length = 1048576
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
in_bytes = 334126804629

# Source: https://huggingface.co/pipenetwork/GLM-5.3-Flash-MLX-8bit
# Source: https://huggingface.co/zai-org/GLM-5.3-Flash
# Architecture: glm5_next (Glm5NextForConditionalGeneration) — VLM with
# DSA sparse MLA + gated-delta (GDN) linear attention + pooled indexer.
# Registered via patches/glm5_next (vendored under vendor/glm5_next).
[sampling_defaults]
temperature = 1.0
top_p = 0.95